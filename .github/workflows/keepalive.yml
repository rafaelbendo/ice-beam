# Keeps the Streamlit Community Cloud dashboard awake. Free apps sleep after ~12 h
# without visitors, and a plain HTTP request does not wake them: the sleep page
# needs its "Yes, get this app back up!" button clicked, so this opens the app in
# headless Chromium and clicks it when present.
name: Keep dashboard awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit dashboard and wake it if asleep
        env:
          APP_URL: https://ice-beam.streamlit.app/
        run: |
          python - <<'EOF'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          wake = re.compile(r"get this app back up", re.I)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(10_000)

              clicked = False
              for frame in page.frames:
                  button = frame.get_by_role("button", name=wake)
                  if button.count():
                      button.first.click()
                      clicked = True
                      break

              if clicked:
                  print("App was asleep; clicked wake button.")
                  # Stay on the page while the app boots.
                  page.wait_for_timeout(90_000)
              else:
                  print("App is awake.")
              browser.close()
          EOF
